# Edge host: HTTPS is forwarded by the existing TCP SNI router to 127.0.0.1:8443.
# Add the three names to that router's map; do not bind a second HTTP server to 443.
# Certificates use an isolated Certbot config directory and timer (see PUBLIC_SITES.md).
server {
    listen 80;
    listen [::]:80;
    server_name computechain.space docs.computechain.space explorer.computechain.space;
    root /var/www/acme;
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name computechain.space;
    ssl_certificate /etc/letsencrypt-computechain/live/computechain.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-computechain/live/computechain.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location / {
        proxy_pass http://192.168.0.100:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}

